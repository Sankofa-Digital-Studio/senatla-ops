name: Senatla Ops native platform gates

on:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".browserslistrc"
      - ".npmrc"
      - "angular.json"
      - "ionic.config.json"
      - "tsconfig*.json"
      - "scripts/normalize-capacitor-spm-paths.mjs"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/native-platforms.yml"
  push:
    branches: [dev, main]
    paths:
      - "android/**"
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".browserslistrc"
      - ".npmrc"
      - "angular.json"
      - "ionic.config.json"
      - "tsconfig*.json"
      - "scripts/normalize-capacitor-spm-paths.mjs"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/native-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senatla-ops-native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENATLA_API_MODE: local
  SENATLA_AUTH_REVIEW_BYPASS: "false"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npm run native:sync:android
      - name: Build unsigned Android debug package
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run native:sync:ios
      - name: Build unsigned iOS simulator application
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
