name: Senatla Ops quality gates

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: senatla-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          SENATLA_API_MODE: local
          SENATLA_AUTH_REVIEW_BYPASS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: senatla-ops-web
          path: www
          if-no-files-found: error

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npx --yes supabase@2.107.0 start
      - run: npx --yes supabase@2.107.0 db reset --local
      - run: npx --yes supabase@2.107.0 test db
      - if: always()
        run: npx --yes supabase@2.107.0 stop --no-backup
