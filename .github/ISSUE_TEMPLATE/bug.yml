name: Bug
description: Report a reproducible Senatla Ops defect
title: "bug: "
labels: [bug, intake]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Operational impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Role, site, viewport, logs and screenshots without personal data.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true

