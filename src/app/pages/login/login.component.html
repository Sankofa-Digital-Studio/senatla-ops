<div class="flex flex-col items-center justify-center h-full bg-slate-950 text-white p-6 space-y-8 animate-fade-in">
  <div class="text-center">
    <div class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center text-slate-950 text-2xl font-black mb-4 mx-auto shadow-lg shadow-yellow-500/20">S</div>
    <h1 class="text-3xl font-black tracking-tight">Senatla Ops</h1>
    <p class="text-slate-400 mt-2 text-sm">
      {{ requestedRole ? ('Role-gated login for ' + requestedRole) : modeHint }}
    </p>
  </div>

  <div class="w-full max-w-sm bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
    <form (ngSubmit)="handleLogin()" class="space-y-4">
      <div>
        <label class="block text-xs uppercase font-bold text-slate-500 mb-1">{{ usernameLabel }}</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          autocomplete="username"
          class="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm focus:border-yellow-500 focus:outline-none transition-colors"
          [placeholder]="usernamePlaceholder"
        >
      </div>
      <div>
        <label class="block text-xs uppercase font-bold text-slate-500 mb-1">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          class="w-full bg-slate-950 border border-slate-700 rounded p-3 text-sm focus:border-yellow-500 focus:outline-none transition-colors"
          [placeholder]="passwordPlaceholder"
        >
      </div>
      <div *ngIf="errorMsg" class="text-red-300 text-xs bg-red-500/10 p-2 rounded border border-red-500/20">
        {{ errorMsg }}
      </div>
      <button type="submit" class="w-full bg-yellow-500 text-slate-950 font-black py-3 rounded hover:bg-yellow-400 transition-colors shadow-lg mt-4">
        Continue
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-800 text-center">
      <p class="text-[11px] text-slate-500">
        Use the work email and password provisioned in Supabase Auth. The selected route still determines the required role.
      </p>
      <a routerLink="/landing" class="inline-block mt-4 text-xs text-slate-500 hover:text-slate-300">Back to landing</a>
    </div>
  </div>
</div>
