<div class="min-h-full flex flex-col items-center justify-center bg-slate-950 text-white p-6 space-y-8">
  <div class="text-center max-w-2xl">
    <div class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center text-slate-950 text-2xl font-bold mb-4 mx-auto">S</div>
    <h1 class="text-3xl font-bold tracking-tight">Role Hub</h1>
    <p class="text-slate-400 mt-2 text-sm">Signed in as {{ auth.displayName() }}. Only the permitted workspace is actionable in this review build.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full max-w-5xl">
    <button
      *ngFor="let card of cards()"
      (click)="openRole(card.route, card.enabled)"
      [disabled]="!card.enabled"
      class="group p-6 bg-slate-900 rounded-2xl border border-slate-800 transition-all text-left disabled:opacity-40 disabled:cursor-not-allowed"
      [class.hover:border-yellow-500]="card.role === 'site' && card.enabled"
      [class.hover:border-blue-500]="card.role === 'office' && card.enabled"
      [class.hover:border-emerald-500]="card.role === 'director' && card.enabled"
      [class.border-yellow-500/60]="card.role === 'site' && card.enabled"
      [class.border-blue-500/60]="card.role === 'office' && card.enabled"
      [class.border-emerald-500/60]="card.role === 'director' && card.enabled"
    >
      <div class="flex items-center justify-between gap-4 mb-4">
        <h3 class="font-bold text-lg">{{ card.title }}</h3>
        <span class="text-[10px] uppercase tracking-[0.2em] text-slate-500">
          {{ card.enabled ? 'Available' : 'Restricted' }}
        </span>
      </div>
      <p class="text-sm text-slate-400 leading-6">{{ card.description }}</p>
      <div class="mt-6 text-xs font-semibold text-slate-300">
        {{ card.enabled ? 'Open workspace' : 'Role does not grant access' }}
      </div>
    </button>
  </div>
</div>
