<div class="min-h-screen w-full flex flex-col font-sans text-slate-900 bg-slate-50 overflow-x-hidden relative">
  <app-time-controls *ngIf="showDebugControls"></app-time-controls>

  <header *ngIf="auth.isAuthenticated() && !isPublicRoute()" class="bg-slate-950 text-white px-4 py-3 flex flex-col md:flex-row justify-between md:items-center gap-3 text-xs z-50 border-b border-slate-800">
    <a routerLink="/landing" class="font-bold text-yellow-500 uppercase tracking-[0.2em]">Senatla Ops</a>
    <div class="flex items-center gap-2 flex-wrap">
      <span class="text-slate-300">Signed in as {{ auth.displayName() }}</span>
      <a [routerLink]="workspaceLink().path" class="px-3 py-2 rounded border border-slate-700 text-slate-200 hover:border-slate-500 transition-colors">{{ workspaceLink().label }}</a>
      <a routerLink="/profile-settings" class="px-3 py-2 rounded border border-slate-700 text-slate-200 hover:border-slate-500 transition-colors">Account</a>
      <button (click)="logout()" class="px-3 py-2 rounded border border-red-900 text-red-300 hover:bg-red-950 transition-colors">Sign out</button>
    </div>
  </header>

  <div class="flex-1 relative min-h-0 overflow-x-hidden overflow-y-auto">
    <router-outlet></router-outlet>
  </div>
</div>
