<div class="h-screen w-full flex flex-col font-sans text-slate-900 bg-slate-50 overflow-hidden relative">
  <app-time-controls *ngIf="showDebugControls"></app-time-controls>

  <nav
    *ngIf="auth.isAuthenticated()"
    class="bg-slate-950 text-white px-4 py-3 flex flex-col md:flex-row justify-between md:items-center gap-3 text-xs z-50 border-b border-slate-800"
  >
    <div class="flex items-center gap-3">
      <span class="font-bold text-yellow-500 uppercase tracking-[0.2em]">Senatla Ops</span>
      <span class="text-slate-500 hidden md:inline">|</span>
      <span class="text-slate-300">{{ auth.displayName() }}</span>
    </div>

    <div class="flex items-center gap-2 flex-wrap">
      <a
        *ngFor="let link of navLinks()"
        [routerLink]="link.path"
        routerLinkActive="bg-yellow-500 text-black"
        class="px-3 py-2 rounded border border-slate-700 text-slate-300 hover:text-white hover:border-slate-500 transition-colors"
      >
        {{ link.label }}
      </a>
      <a
        routerLink="/landing"
        routerLinkActive="bg-yellow-500 text-black"
        class="px-3 py-2 rounded border border-slate-700 text-slate-300 hover:text-white hover:border-slate-500 transition-colors"
      >
        Role Hub
      </a>
      <button
        (click)="logout()"
        routerLink="/login"
        class="px-3 py-2 rounded border border-red-900 text-red-300 hover:bg-red-950 transition-colors"
      >
        Sign out
      </button>
    </div>
  </nav>

  <div class="flex-1 relative overflow-hidden">
    <router-outlet></router-outlet>
  </div>
</div>
